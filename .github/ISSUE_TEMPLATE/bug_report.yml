name: Bug report
description: Something does not work as described in the user guide.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not attach personal photos; describe them instead (size, format, how many).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add 6 JPEG photos
        2. Choose A4 portrait
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Windows 11 / Safari on iPhone 15
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Seed (optional)
      description: The number after ?seed= in the address, if the layout matters.
