# Builds each pull request and publishes it to https://<user>.github.io/<repo>/pr-preview/pr-<n>/
# for user testing, with a comment on the pull request that links to it. The preview is removed
# when the pull request is closed.
#
# One-time setup: repository Settings > Pages > Build and deployment > Source: Deploy from a
# branch, branch `gh-pages`, folder `/ (root)`. The main site is published to the same branch
# by pages.yaml, so it keeps working.
#
# Pull requests from forks get no preview: their token cannot write to the repository.
name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

# A newer commit on the same pull request makes the older build pointless.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  preview:
    name: Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      - run: npm run build
        if: github.event.action != 'closed'
      - name: Publish the preview
        if: github.event.action != 'closed'
        run: scripts/publish-pages.sh preview dist "$PR"
      - name: Remove the preview
        if: github.event.action == 'closed'
        run: scripts/publish-pages.sh remove "$PR"

      - name: Comment with the link
        if: github.event.action != 'closed'
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          repo=${GITHUB_REPOSITORY#*/}
          url="https://${owner}.github.io/${repo}/pr-preview/pr-${PR}/"
          body="<!-- pr-preview -->
          **Preview of this pull request:** ${url}

          Built from ${HEAD_SHA::7}. It appears a minute or two after the build, and is removed when the pull request is closed. It uses the same browser storage as the main site, so saved work is shared with it.

          _Generated by [Claude Code](https://claude.ai/code)_"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- pr-preview -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi
