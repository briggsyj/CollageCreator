# Builds the static site and publishes it to GitHub Pages when master changes.
# Pages source "GitHub Actions" serves it through the deploy job below. Pull request previews
# (preview.yaml) need Source: Deploy from a branch, `gh-pages` instead; this workflow publishes
# the main site to that branch too, so it works under either setting.
name: GitHub Pages

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "specs/**"
      - ".specify/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "specs/**"
      - ".specify/**"
  workflow_dispatch:

permissions:
  contents: write

# A newer commit on the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build and check under a sub-path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Pages serves a project site at /<repo>/ with no custom headers. Run the key
      # user flows against the real build served that way: assets, workers, the
      # CSP <meta> tag, offline use and the licence links.
      - run: npx playwright install --with-deps chromium
      - name: Smoke test at /CollageCreator/
        run: |
          node scripts/serve-subpath.mjs dist /CollageCreator/ 4174 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4174/CollageCreator/ >/dev/null && break
            sleep 0.5
          done
          E2E_BASE_URL=http://localhost:4174/CollageCreator/ npx playwright test --project=chromium \
            --grep "saves a PNG|network disconnected|another language|About dialog|other origins|right way up"

      # The same build, published to the gh-pages branch beside the pull request previews
      # (preview.yaml). It is what GitHub serves once Pages is set to deploy from that branch.
      - name: Publish to the gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-pages.sh site dist

      # Only a real deployment needs the Pages site to exist and be enabled.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # While Pages is set to "GitHub Actions" this serves the site; once it is set to deploy from the
    # gh-pages branch (needed for pull request previews) this step has nothing to do and may fail.
    continue-on-error: true
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
