name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "specs/**"
      - ".specify/**"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "specs/**"
      - ".specify/**"

permissions:
  contents: read

# A newer commit on the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  checks:
    name: Lint, types, headers, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:headers
      # A report only: untranslated strings fall back to English.
      - run: npm run check:i18n
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (${{ matrix.browser }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    # The quick checks go first, so a lint error does not cost a WebKit run.
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        # WebKit is the slow engine here, so its tests are split across three jobs that run side by side.
        include:
          - browser: webkit
            shard: 1/3
          - browser: webkit
            shard: 2/3
          - browser: webkit
            shard: 3/3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }} ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
