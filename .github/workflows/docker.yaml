name: Docker build

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "specs/**"
      - ".specify/**"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "specs/**"
      - ".specify/**"

permissions:
  contents: read

# A newer commit on the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  docker:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Wait for healthy container and fetch the app
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q photocollage)")
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "health: $status"
          [ "$status" = "healthy" ]
          curl -fsS http://localhost:8080/ | grep -q "Collage Creator"
          test "$(docker compose exec -T photocollage id -u)" != "0"
      - if: always()
        run: docker compose down
