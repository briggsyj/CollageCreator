server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # nginx drops inherited add_header lines in any location that sets its own,
    # so every location includes the shared security headers explicitly.

    # Single-page fallback, and never cache the entry point.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Licence texts (plain .txt files, so any static host serves them readable).
    location ~ ^/(LICENSE|NOTICE|THIRD-PARTY-LICENSES)\.txt$ {
        charset utf-8;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
